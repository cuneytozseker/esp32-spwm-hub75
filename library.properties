name=esp32-spwm-hub75
version=0.2.0
author=Cuneyt Ozseker
maintainer=Cuneyt Ozseker
sentence=ESP32-S3 driver for S-PWM HUB75 LED panels (ICND1065L and similar).
paragraph=S-PWM panels take one 16-bit greyscale word per pixel per colour and do their own PWM, so binary-code-modulation libraries cannot drive them. This driver clocks the whole waveform - pixel data, row address, latch and blanking - out of LCD_CAM via GDMA, so no CPU stall can disturb the scan. Includes basic drawing primitives.
category=Display
url=https://github.com/cuneytozseker/esp32-spwm-hub75
architectures=esp32
includes=spwm_hub75.h
